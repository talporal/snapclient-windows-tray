name: Windows build and release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'installer/**'
      - 'Directory.Build.props'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
permissions:
  contents: write
  actions: write
concurrency:
  group: snapcast-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    steps:
      - name: Verify requested home runner
        shell: powershell
        env:
          ACTUAL_RUNNER: ${{ runner.name }}
        run: |
          if ($env:ACTUAL_RUNNER -ine 'T-NET-SERVER') { throw "Expected T-NET-SERVER, assigned runner: $env:ACTUAL_RUNNER" }
          Write-Host "Building on $env:ACTUAL_RUNNER."
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: true
      - name: Remove old artifacts and cancel previous builds
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .\.github\scripts\cleanup-actions.ps1 -CancelQueuedBuilds
      - name: Clean compilation outputs
        shell: powershell
        run: |
          Get-ChildItem src,tests -Directory -Recurse | Where-Object { $_.Name -in @('bin','obj') } | Sort-Object { $_.FullName.Length } -Descending | Remove-Item -Recurse -Force
      - name: Set writable .NET install directory
        shell: powershell
        run: '"DOTNET_INSTALL_DIR=$env:RUNNER_TEMP\dotnet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Check configuration and argument handling
        shell: powershell
        run: |
          dotnet run --project tests/Snapcast.Checks/Snapcast.Checks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Configuration checks failed.' }
      - name: Build installer from source
        shell: powershell
        run: .\installer\build.ps1 -Version '0.1.1.${{ github.run_number }}' -OutputDirectory "$env:RUNNER_TEMP\snapcast-output-${{ github.run_id }}"
      - name: Publish installer directly to GitHub Releases
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .\.github\scripts\publish-release.ps1 -Directory "$env:RUNNER_TEMP\snapcast-output-${{ github.run_id }}" -Title 'Snapcast Windows'
